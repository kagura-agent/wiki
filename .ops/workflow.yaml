name: wiki-patrol
description: |
  Wiki 巡检 — 发现问题，开 issue，不修。
  修复由 wiki-fix workflow 负责。
start: health-check
nodes:
  health-check:
    task: |
      跑 wiki-lint 收集健康数据：
      ```
      cd ~/.openclaw/workspace/wiki && python3 scripts/wiki-lint.py
      ```
      记录：orphan 数、broken links、collisions、index drift、总卡片数。
      把结果写入 .ops/last-health.json（覆盖上次的）。
    executor: subagent
    next: diff

  diff:
    task: |
      对比本次和上次的 wiki 健康数据（.ops/last-health.json vs .ops/prev-health.json）。
      分析趋势：
      - 哪些指标变好了？
      - 哪些变差了？
      - 有没有反复出现的 pattern？
      如果是首次跑（没有 prev），跳过对比，直接描述当前状态。
      输出变化摘要。
    next: file-issues

  file-issues:
    task: |
      根据 health-check 的结果，为值得修的问题开 GitHub issue。

      **去重规则（必须严格执行）：**
      1. 先拉所有 open issues：`gh issue list -R kagura-agent/wiki --state open --limit 100 --json number,title,labels`
      2. 对每个待开的 issue，检查是否已有同类 open issue（标题/内容重叠）
      3. 已有 → 跳过，不开重复的
      4. 如果某类问题可以合并成一个 batch issue（例如"5 orphan cards need linking"），合并开

      **开 issue 规则：**
      - 每个 issue 有明确的 label：orphan / broken-link / thin-card / index-drift / frontmatter / stale
      - 都加 auto-patrol label（标记来源）
      - title 要具体：包含文件名或数量，不要泛泛的"fix orphans"
      - body 里列出具体文件路径和建议修法
      - 优先级高的（broken-link、index-drift）加 next label

      **不开 issue 的情况：**
      - 问题数量没变化且已有 open issue 覆盖
      - 纯噪音（stale 但内容仍有效的文件）

      环境：proxy: export https_proxy=http://127.0.0.1:1083
    executor: subagent
    next: report

  report:
    task: |
      发送本轮巡检报告：
      - 健康数据快照（关键指标 + 趋势箭头 ↑↓→）
      - 本轮新开了几个 issue（列 issue 号）
      - 当前 open issue 总数
      简洁，bullet list，不超过 15 行。
    terminal: true
