name: wiki-ops
description: |
  Wiki 维护循环 — 检查健康、修复问题、反思改进方法。
  每轮维护完反思节点可以改这个 workflow 本身。
start: health-check
nodes:
  health-check:
    task: |
      跑 wiki-lint 收集健康数据：
      ```
      cd ~/.openclaw/workspace/wiki && python3 scripts/wiki-lint.py
      ```
      记录：orphan 数、broken links、collisions、总卡片数。
      把结果写入 .ops/last-health.json（覆盖上次的）。
    executor: subagent
    next: diff

  diff:
    task: |
      对比本次和上次的 wiki 健康数据（.ops/last-health.json vs .ops/prev-health.json）。
      分析趋势：
      - 哪些指标变好了？为什么？
      - 哪些变差了？为什么？
      - 有没有反复出现的 pattern？
      如果是首次跑（没有 prev），跳过对比，直接描述当前状态。
      输出变化摘要。
    next: fix

  fix:
    task: |
      根据 health-check 和 diff 的结果，修能修的问题：
      - Orphan 卡片：判断是该补 wikilink 还是该删除/合并
      - Broken links：修复指向或创建缺失卡片
      - 薄卡片（<3行内容）：充实或合并到相关卡片
      - 过时内容：标记或更新
      每修一个记录修了什么、为什么。
      不确定的不动，记到报告里让 Luna 决定。
      修完后 git commit + push。
    executor: subagent
    next: reflect

  reflect:
    task: |
      反思本轮维护：
      1. 这次发现的问题，上次为什么没发现？要不要加检测规则？
      2. 有没有反复出现的 pattern？说明什么？
      3. 哪些手动步骤可以自动化？
      4. 这个 workflow 本身需要改吗？（节点顺序、任务描述、新增/删除节点）
      如果需要改 workflow → 直接改 wiki/.ops/workflow.yaml 并 commit。
      把反思记录写入 wiki/.ops/reflections.md（追加，带日期）。
    executor: subagent
    next: report

  report:
    task: |
      在 #wiki-ops channel 发送本轮维护报告：
      - 健康数据 + 趋势
      - 本轮修复了什么
      - 未解决的问题（需要 Luna 决定的）
      - 反思要点
      简洁，用 bullet list，不要长篇大论。
    terminal: true
